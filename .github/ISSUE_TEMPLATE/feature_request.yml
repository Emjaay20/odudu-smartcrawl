name: Feature request
description: Ask for something Odudu does not do yet.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Check the [roadmap](https://wizzywit.github.io/odudu/docs/roadmap/) first. It lists what is planned and what was decided against.
  - type: textarea
    id: problem
    attributes:
      label: What you are trying to do
      description: The goal, not the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
      description: How you would like it to work, and anything you tried.
