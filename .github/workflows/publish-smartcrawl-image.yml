name: Publish SmartCrawl authentication image

on:
  push:
    branches: [codex/smartcrawl-branding]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile
          push: true
          tags: |
            ghcr.io/emjaay20/odudu-smartcrawl-brand:smartcrawl
            ghcr.io/emjaay20/odudu-smartcrawl-brand:${{ github.sha }}
      - name: Make the deployment image public
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh api --method PATCH
          -H "Accept: application/vnd.github+json"
          /user/packages/container/odudu-smartcrawl-brand
          -f visibility=public
