name: docs-commands

# Runs every command a guide marks runnable against the quickstart stack. A
# command in a guide is a runnable block or it is not in the guide;
# an illustrative one is tagged `text`.
#
# This is a workflow of its own, so verify.yml's `gate` cannot wait for it:
# a branch ruleset has to require `docs-commands` by name for it to block a
# merge.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: docs-commands-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  docs-commands:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - uses: ./.github/actions/image
        with:
          revision: ${{ github.sha }}

      - name: Make the administrator's credentials
        run: |
          password="$(openssl rand -hex 16)"
          echo "::add-mask::$password"
          {
            echo "ODUDU_ADMIN_EMAIL=admin@odudu.local"
            echo "ODUDU_ADMIN_PASSWORD=$password"
            echo "ODUDU_BASE=http://localhost:3195"
            echo "COMPOSE_FILE=$GITHUB_WORKSPACE/quickstart/compose.yaml"
            echo "COMPOSE_PROJECT_NAME=odudu-quickstart-stack"
            echo "ODUDU_IMAGE=odudu-smoke-odudu"
          } >> "$GITHUB_ENV"

      - name: Start the quickstart stack
        run: quickstart/stack.sh up odudu-smoke-odudu 3195

      # The quick start creates the tenant, the user and the first client the
      # guides sign in with, so it runs first. The operating pages run last,
      # against the stack the rest have left.
      - name: Run the guides' commands
        run: node tools/docs-run/src/index.ts apps/docs/content/en/quick-start apps/docs/content/en/guides apps/docs/content/en/operating

      - name: Stop the stack
        if: always()
        run: quickstart/stack.sh down
