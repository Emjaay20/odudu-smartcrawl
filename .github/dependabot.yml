# The workspace root holds the one pnpm-lock.yaml every package resolves
# through, so an update made there changes the lockfile with the manifest.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # pnpm refuses a version younger than minimumReleaseAge (1440 minutes),
    # so a pull request for one would fail to install.
    cooldown:
      default-days: 2
    open-pull-requests-limit: 5
    # fastify is a dependency of several workspace packages; one update per
    # package cannot keep the shared lockfile consistent, so they move together.
    groups:
      fastify:
        patterns: ['fastify', '@fastify/*']
      # Everything else that moves by a minor or patch lands in one weekly PR.
      npm-minor-patch:
        patterns: ['*']
        update-types: ['minor', 'patch']
    # The types follow the Node major the server runs on (ADR 0001). Babel 8
    # breaks the React Compiler plugin the console builds with.
    ignore:
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      - dependency-name: '@babel/core'
        update-types: ['version-update:semver-major']
  - package-ecosystem: npm
    directory: /examples/web-app
    schedule:
      interval: weekly
    # pnpm refuses a version younger than minimumReleaseAge (1440 minutes),
    # so a pull request for one would fail to install.
    cooldown:
      default-days: 2
    groups:
      example-minor-patch:
        patterns: ['*']
        update-types: ['minor', 'patch']
    # The examples follow the repository's Node and TypeScript majors.
    ignore:
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
  - package-ecosystem: npm
    directory: /examples/single-page-app
    schedule:
      interval: weekly
    # pnpm refuses a version younger than minimumReleaseAge (1440 minutes),
    # so a pull request for one would fail to install.
    cooldown:
      default-days: 2
    groups:
      example-minor-patch:
        patterns: ['*']
        update-types: ['minor', 'patch']
    # The examples follow the repository's Node and TypeScript majors.
    ignore:
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
  - package-ecosystem: npm
    directory: /examples/api
    schedule:
      interval: weekly
    # pnpm refuses a version younger than minimumReleaseAge (1440 minutes),
    # so a pull request for one would fail to install.
    cooldown:
      default-days: 2
    groups:
      example-minor-patch:
        patterns: ['*']
        update-types: ['minor', 'patch']
    # The examples follow the repository's Node and TypeScript majors.
    ignore:
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
  - package-ecosystem: npm
    directory: /examples/machine-to-machine
    schedule:
      interval: weekly
    # pnpm refuses a version younger than minimumReleaseAge (1440 minutes),
    # so a pull request for one would fail to install.
    cooldown:
      default-days: 2
    groups:
      example-minor-patch:
        patterns: ['*']
        update-types: ['minor', 'patch']
    # The examples follow the repository's Node and TypeScript majors.
    ignore:
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-minor-patch:
        patterns: ['*']
        update-types: ['minor', 'patch']
  # Base images are pinned by digest (tests/lint/base-images-pinned.test.ts);
  # Dependabot moves the tag and the digest together.
  - package-ecosystem: docker
    directories:
      - /infra/docker
      - /infra/conformance/proxy
    schedule:
      interval: weekly
    groups:
      base-images:
        patterns: ['*']
    # Odudu runs on an even-numbered Node LTS (ADR 0001). A release becomes LTS
    # months after it ships, and Dependabot cannot tell, so the Node major moves
    # by hand each October (ADR 0001, amendment 2026-10-27). Patch and minor
    # updates still come.
    ignore:
      - dependency-name: node
        update-types: ['version-update:semver-major']
  - package-ecosystem: docker-compose
    directories:
      - /infra/docker
      - /infra/conformance
      - /quickstart
    schedule:
      interval: weekly
    # A new Postgres major cannot open the previous one's data directory.
    ignore:
      - dependency-name: postgres
        update-types: ['version-update:semver-major']
      # The conformance suite's database: a major needs its own check.
      - dependency-name: mongo
        update-types: ['version-update:semver-major']
    groups:
      base-images:
        patterns: ['*']
